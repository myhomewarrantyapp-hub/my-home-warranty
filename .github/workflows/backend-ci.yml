name: Backend CI

on:
  push:
    branches: [phase19-admin-controls]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mhw_ci
      - run: npx prisma generate
      - run: npm run build

name: Backend CI

on:
  push:
    branches: [phase19-admin-controls]
    paths:
      - "backend/**"
      - "frontend/**"
      - "index.html"
      - "translations/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mhw_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mhw_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mhw_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mhw_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - name: Apply versioned migrations to temporary PostgreSQL
        run: npx prisma migrate deploy
      - name: Confirm migration state
        run: npx prisma migrate status
      - run: npx prisma generate
      - run: npm run build
      - name: Validate frontend JavaScript
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          for (const file of ['frontend/index.html', 'index.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const begin = html.indexOf('<script>');
            const finish = html.indexOf('</script>', begin);
            if (begin < 0 || finish < 0) throw new Error('Inline application script not found in ' + file);
            const out = '/tmp/' + file.replace(/[^a-z0-9]/gi, '-') + '.js';
            fs.writeFileSync(out, html.slice(begin + 8, finish));
            cp.execFileSync('node', ['--check', out], {stdio: 'inherit'});
            console.log('Validated ' + file);
          }
          NODE
      - name: Validate translation JSON
        working-directory: .
        run: node -e "JSON.parse(require('fs').readFileSync('translations/te.json','utf8')); console.log('Telugu translation JSON valid')"
